<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Status Page | Instant Hosting</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .accent-gradient { background: linear-gradient(90deg, #00d4ff, #ffd700); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6">
    <main class="max-w-2xl w-full space-y-8">
        <header class="text-center">
            <h1 class="text-5xl font-extrabold mb-4 accent-gradient">System Status</h1>
            <p class="text-slate-400">Real-time monitoring for your micro-services.</p>
        </header>

        <section class="glass p-8 rounded-2xl shadow-2xl">
            <div class="flex items-center justify-between mb-6">
                <span class="text-lg font-semibold">API Gateway</span>
                <span class="px-3 py-1 bg-emerald-500/20 text-emerald-400 border border-emerald-500/50 rounded-full text-sm">Operational</span>
            </div>
            <div class="w-full bg-slate-800 rounded-full h-2.5 mb-8">
                <div class="bg-emerald-500 h-2.5 rounded-full" style="width: 98%"></div>
            </div>

            <form class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Your Email</label>
                    <input type="email" class="w-full px-4 py-2 rounded-lg bg-slate-900 border border-slate-700 focus:ring-2 focus:ring-cyan-500 outline-none transition-all" placeholder="name@company.com">
                </div>
                <button class="w-full py-3 px-6 bg-cyan-600 hover:bg-cyan-500 rounded-lg font-bold transition-colors shadow-lg shadow-cyan-900/20">
                    Get Update Notifications
                </button>
            </form>
        </section>

        <footer class="text-center text-slate-500 text-sm">
            Powered by Redbean &bull; Instant Hosting Template
        </footer>
    </main>
</body>
</html>
